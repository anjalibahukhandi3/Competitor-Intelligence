version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: competitor_intel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: competitor_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: competitor_intel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../
      dockerfile: docker/app.Dockerfile
    container_name: competitor_intel_web
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/competitor_intel
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../
      dockerfile: docker/worker.Dockerfile
    container_name: competitor_intel_worker
    command: celery -A src.jobs.celery_app worker --loglevel=info
    volumes:
      - ../:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/competitor_intel
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../
      dockerfile: docker/worker.Dockerfile
    container_name: competitor_intel_beat
    command: celery -A src.jobs.celery_app beat --loglevel=info
    volumes:
      - ../:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/competitor_intel
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
