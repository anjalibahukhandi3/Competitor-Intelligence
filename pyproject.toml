# =============================================================================
# Competitor Intelligence AI Agent — pyproject.toml
# Build system: uv  |  Format: PEP 621
# =============================================================================

[project]
name = "competitor-intelligence-agent"
version = "0.1.0"
description = "Production-ready AI SaaS continuously monitoring competitor updates using PydanticAI and MCP."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
license = { text = "MIT" }

# ---------------------------------------------------------------------------
# Runtime dependencies (installed by `uv sync`)
# ---------------------------------------------------------------------------
dependencies = [
    # Web framework & server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Database — async SQLAlchemy + PostgreSQL driver
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    # AI / Agent framework
    "mcp>=0.1.0",
    # Task queue & caching
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    # Reports & notifications
    "weasyprint>=62.1",
    "resend>=2.4.0",
    # Structured logging
    "structlog>=24.2.0",
    # Security (JWT + password hashing)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "google-genai>=2.14.0",
    "jinja2>=3.1.6",
    "email-validator>=2.3.0",
]

# ---------------------------------------------------------------------------
# Build system — hatchling supports src/ layout natively
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "isort>=5.13.2",
    "mypy>=1.10.0",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
